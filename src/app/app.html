<main class="main">
  <div class="content">
    <h1>{{ nomMatiere }}</h1>
    <h2>Séance TP {{ numeroSeance }}</h2>
    <p class="description">Prise en main d'Angular, première application</p>
    <h4>Liste des étudiants</h4>
    <app-etudiant
      *ngFor="let etu of tabEtudiants"
      [nomEtu]="etu.nom"
      [prenomEtu]="etu.prenom"
      [statutEtu]="etu.present"
      [commentaireEtu]="commentaireSeance"
    ></app-etudiant>
    <div class="button-container">
      <button class="btn btn-success" [disabled]="!estAuth()" (click)="rendTousPres()">
        Tous présents
      </button>
    </div>
    <p>Entrez un commentaire :</p>
    <input type="text" class="form-control" [(ngModel)]="commentaireSeance" />
    <p>Voilà votre commentaire :</p>
    <p>{{ commentaireSeance }}</p>
  </div>
</main>

<router-outlet />
